services:
  resortpass-api:
    build:
      context: .
      args:
        PUBLIC_POSTHOG_KEY: ${PUBLIC_POSTHOG_KEY:-}
        PUBLIC_POSTHOG_HOST: ${PUBLIC_POSTHOG_HOST:-/a}
    container_name: resortpass-api
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    env_file: .env
    environment:
      - DB_PATH=/app/data/resortpass.db
      - API_PORT=3000
      - STATUS_JSON_PATH=/app/dist/api/status.json
    volumes:
      - ./data:/app/data
      - ./dist:/app/dist
    networks:
      - caddy-net

  resortpass-checker:
    build: .
    container_name: resortpass-checker
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    command: >
      /bin/sh -c "while true; do
        echo \"[$$(date -Iseconds)] Running checker...\";
        bun run server/checker.ts;
        echo \"[$$(date -Iseconds)] Sleeping 900s (15min)...\";
        sleep 900;
      done"
    env_file: .env
    environment:
      - DB_PATH=/app/data/resortpass.db
      - STATUS_JSON_PATH=/app/dist/api/status.json
    volumes:
      - ./data:/app/data
      - ./dist:/app/dist
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true
