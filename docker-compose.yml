services:
  resortpass-api:
    build: .
    container_name: resortpass-api
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    env_file: .env
    environment:
      - DB_PATH=/app/data/resortpass.db
      - API_PORT=3000
      - STATUS_JSON_PATH=/app/dist/api/status.json
      # The entrypoint copies the image's baked-in dist over the mounted volume
      # when this is 1, which is its default. The site is deployed by rsync, so
      # that turns every container restart into a silent partial rollback: the
      # image carries whatever was built when it was last built, and `cp -a`
      # overwrites without deleting, so old pages come back while new ones stay.
      # It nearly reverted the localised slugs. The checker already set this;
      # the API did not.
      - SYNC_DIST=0
    volumes:
      - ./data:/app/data
      - ./dist:/app/dist
    networks:
      - caddy-net

  resortpass-checker:
    build: .
    container_name: resortpass-checker
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    command: >
      /bin/sh -c "while true; do
        echo \"[$$(date -Iseconds)] Running checker...\";
        bun run server/checker.ts;
        echo \"[$$(date -Iseconds)] Sleeping 900s (15min)...\";
        sleep 900;
      done"
    env_file: .env
    environment:
      - DB_PATH=/app/data/resortpass.db
      - STATUS_JSON_PATH=/app/dist/api/status.json
      - SYNC_DIST=0
    volumes:
      - ./data:/app/data
      - ./dist:/app/dist
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true
