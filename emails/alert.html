<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0F1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #0F1117;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #1A1D27; border-radius: 16px; overflow: hidden;">
          <!-- Header -->
          <tr>
            <td style="padding: 32px 32px 0; text-align: center;">
              <h1 style="color: #E2E8F0; font-size: 20px; font-weight: 700; margin: 0;">
                ResortPass Tracker
              </h1>
            </td>
          </tr>
          <!-- Content -->
          <tr>
            <td style="padding: 24px 32px 32px;">
              <p style="color: #E2E8F0; font-size: 15px; line-height: 1.6; margin: 0 0 8px;">
                {{GREETING}}
              </p>
              <p style="color: #22C55E; font-size: 18px; font-weight: 700; line-height: 1.4; margin: 0 0 16px;">
                {{HEADLINE}}
              </p>
              <p style="color: #94A3B8; font-size: 15px; line-height: 1.6; margin: 0 0 24px;">
                {{URGENCY}}
              </p>
              <!-- CTA Button -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{SHOP_URL}}" style="display: inline-block; background-color: #22C55E; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none; padding: 16px 40px; border-radius: 12px;">
                      {{BUTTON}}
                    </a>
                  </td>
                </tr>
              </table>
              <p style="color: #94A3B8; font-size: 14px; line-height: 1.5; margin: 24px 0 0; text-align: center;">
                {{CLOSING}}
              </p>
              {{COMMUNITY_SECTION}}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding: 16px 32px 24px; border-top: 1px solid #2D3748;">
              <p style="color: #64748B; font-size: 12px; line-height: 1.5; margin: 0; text-align: center;">
                {{REASON}}
                <br />
                <a href="{{UNSUBSCRIBE_URL}}" style="color: #3B82F6; text-decoration: none;">{{UNSUBSCRIBE}}</a>
                &nbsp;&middot;&nbsp;
                <a href="{{SITE_URL}}" style="color: #3B82F6; text-decoration: none;">resortpass-europapark.ch</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
