<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
</head>
<body style="margin:0;padding:0;background-color:#FFF9F0;font-family:Verdana,Arial,sans-serif;color:#2E1065;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FFF9F0;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:3px solid #2E1065;border-radius:20px;overflow:hidden;">
        <tr><td style="height:8px;background-color:#16A34A;border-bottom:4px solid #FACC15;"></td></tr>
        <tr><td align="center" style="padding:28px 28px 0;">
          <img src="{{ASSET_URL}}/favicon.svg" width="52" height="52" alt="" style="display:block;margin:0 auto 10px;" />
          <p style="font-size:18px;font-weight:700;margin:0;color:#2E1065;">resortpass<span style="color:#EC4899;">tracker</span></p>
        </td></tr>
        <tr><td style="padding:20px 28px 28px;text-align:center;">
          <p style="font-size:15px;line-height:1.6;margin:0 0 14px;color:#2E1065;">{{GREETING}}</p>
          <div style="background:#E6F7EF;border:3px solid #16A34A;border-radius:16px;padding:16px 18px;margin-bottom:16px;">
            <h1 style="font-size:20px;line-height:1.3;margin:0;color:#15803D;">{{HEADLINE}}</h1>
          </div>
          <p style="font-size:14px;line-height:1.65;margin:0 0 24px;color:#5B4C82;">{{URGENCY}}</p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
            <a href="{{SHOP_URL}}" style="display:inline-block;background:#16A34A;color:#FFFFFF;font-size:17px;font-weight:700;text-decoration:none;padding:16px 36px;border:3px solid #2E1065;border-radius:999px;">{{BUTTON}}</a>
          </td></tr></table>
          <p style="font-size:13px;line-height:1.5;margin:22px 0 0;color:#8B7BB3;">{{CLOSING}}</p>
          {{COMMUNITY_SECTION}}
        </td></tr>
        <tr><td style="padding:14px 28px 20px;border-top:2px solid #F1EBFB;text-align:center;">
          <p style="font-size:11px;line-height:1.6;margin:0;color:#8B7BB3;">{{REASON}}<br /><a href="{{UNSUBSCRIBE_URL}}" style="color:#7C3AED;font-weight:700;text-decoration:none;">{{UNSUBSCRIBE}}</a> &middot; <a href="{{SITE_URL}}" style="color:#7C3AED;font-weight:700;text-decoration:none;">resortpass-europapark.ch</a></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
